<!DOCTYPE html>
<html>
<head>
<title>Upload tài liệu</title>

<style>

body{
font-family:Segoe UI;
background:#4a37d8;
padding:50px;
}

.form{
background:rgb(244, 241, 255);
padding:30px;
width:400px;
margin:auto;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input,select{
width:100%;
padding:10px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:5px;
}

button{
background:#6366f1;
color:white;
padding:10px;
border:none;
border-radius:5px;
width:100%;
}

</style>

</head>

<body>

<div class="form">

<h2>Upload tài liệu</h2>

<input type="text" placeholder="Tiêu đề">

<select>
<option>Đề thi</option>
<option>Slide</option>
<option>Giáo trình</option>
<option>Tóm tắt</option>
</select>

<input type="file">

<button>Upload</button>

</div>

</body>
</html>
