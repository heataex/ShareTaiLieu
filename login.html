<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập - ShareTaiLieu</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}


body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}


.login-container{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:40px;
border-radius:15px;
width:350px;
color:white;
box-shadow:0 10px 30px rgba(0,0,0,0.3);
text-align:center;
}

.login-container h2{
margin-bottom:25px;
}


.input-box{
margin-bottom:20px;
text-align:left;
}

.input-box label{
font-size:14px;
}

.input-box input{
width:100%;
padding:10px;
margin-top:5px;
border:none;
border-radius:5px;
outline:none;
}


button{
width:100%;
padding:10px;
border:none;
border-radius:6px;
background:#ffffff;
color:#333;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#f1f1f1;
}


.register{
margin-top:15px;
font-size:14px;
}

.register a{
color:white;
font-weight:bold;
text-decoration:none;
}

</style>

</head>

<body>

<div class="login-container">

<h2>Đăng nhập</h2>

<form>

<div class="input-box">
<label>Email</label>
<input type="email" placeholder="Nhập email">
</div>

<div class="input-box">
<label>Mật khẩu</label>
<input type="password" placeholder="Nhập mật khẩu">
</div>

<button>Đăng nhập</button>

</form>

<div class="register">
Chưa có tài khoản? <a href="#">Đăng ký</a>
</div>

</div>

</body>
</html>
