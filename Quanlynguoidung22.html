<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <title>Admin Panel - Quản lý tài liệu</title>

        <style>
            body{
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background:f5f6fa;
            }
            .container{
                display:flex;
            }
            .sidebar{ width:220px;
                 background:white;
                 height:100vh;
                 border-right:1px solid #eee;
                 padding:20px;
            }
            .sidebar h3{ 
                margin-bottom:30px;
             } 
            
            .menu{ 
                list-style:none;
                 padding:0; 
            }
            .menu li{ 
                padding:12px;
                 border-radius:6px; 
                margin-bottom:10px;
                 cursor:pointer; 
            } 
            .menu li:hover{ 
                background:#f0f2f5;
             } 
            
            .active{ 
                background:#e7f0ff; 
                color:#2f6fed; 
                font-weight:bold; 
            }
            .logout{ 
                position:absolute; 
                bottom:20px;
                 color:red; 
            } 
            .content{ 
                flex:1; 
                padding:30px; } 
            .header{ 
                font-size:22px; 
                font-weight:bold;
                 margin-bottom:20px; 
            }
            .toolbar{ 
                display:flex; 
                justify-content:space-between;
                 margin-bottom:20px;
                 } 
            .search{ 
                padding:10px; 
                width:250px; 
                border:1px solid #ddd; 
                border-radius:6px; 
            } 
            .filter{ 
                padding:10px;
                 border:1px solid #ddd;
                  border-radius:6px; 
                } 
             .table{ 
                background:white;
                 border-radius:8px; 
                 border:1px solid #eee;
                 } 
                 table{ 
                    width:100%; 
                    border-collapse:collapse;
                 } 
            th,td{ 
                padding:14px;
                 text-align:left;
                 } 
            th{ 
                background:#f8f9fb; 
                font-size:14px;
             } 
            .empty{
                 text-align:center; 
                 
                 padding:40px; color:#888;
                 } 
            </style> 

            </head> 

            <body> 

                <div class="container"> 

                <div class="sidebar"> 
                <h3>Admin Panel</h3> 
            
            <ul class="menu">
                 <li>Tổng quan</li> 
            <li>Quản lý người dùng</li> 
            <li class="active">Quản lý tài liệu</li> 
            <li>Duyệt tự động</li> 
            </ul> 
            
            <div class="logout">Đăng xuất</div> 

            </div>

            <div class="content"> 
                <div class="header">Quản lý tài liệu</div>
                 <div class="toolbar"> 
                    <input class="search" type="text" placeholder="Tìm tài liệu...">
                     <select class="filter"> 
                        <option>Tất cả trạng thái</option> 
                        <option>Đã duyệt</option> 
                        
                        
                        <option>Chờ duyệt</option>
                     </select>
                     </div>
                      <div class="table">
                         <table>
                            
                            <tr> 
                                <th>Tài liệu</th> 
                                <th>Danh mục</th>
                                 <th>Người đăng</th> 
                                 <th>Trạng thái</th> 
                                 <th>Hành động</th>
                                 </tr>

                                 <tr>
                                     <td colspan="5" class="empty"> 
                                        Chưa có tài liệu nào 
                                    </td> 
                                </tr>

                             </table>

                             </div>

                             </div>
                             </div>
                             </body>
                             </html>
            </html>
